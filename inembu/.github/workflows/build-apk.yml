name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x inembu/gradlew

    - name: Build FOSS Debug APK
      run: cd inembu && ./gradlew buildFossDebug

    - name: Build FOSS Release APK (unsigned)
      run: cd inembu && ./gradlew buildFossRelease
      continue-on-error: true

    - name: Run unit tests
      run: cd inembu && ./gradlew testFossDebugUnitTest
      continue-on-error: true

    - name: Upload FOSS Debug APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: foss-debug-apk
        path: inembu/build/outputs/apk/foss/debug/*.apk

    - name: Upload FOSS Release APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: foss-release-apk
        path: inembu/build/outputs/apk/foss/release/*.apk

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: inembu/build/reports/tests/
