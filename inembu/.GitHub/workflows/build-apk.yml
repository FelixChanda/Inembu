name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Generate test keystore
        run: |
          keytool -genkeypair \
            -alias testkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore release-key.jks \
            -storepass android \
            -keypass android \
            -dname "CN=Test,O=Test,C=ZM"

      - name: Grant execute permission
        run: chmod +x gradlew
        working-directory: ./inembu

      - name: Build APK
        run: ./gradlew assemblePlayRelease -PwithPlayServices=false --no-daemon
        working-directory: ./inembu

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: inembu/app/build/outputs/apk/play/release/*.apk
